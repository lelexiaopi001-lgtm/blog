# ============================================================
# Aurora Blog 极光博客 —— Nginx 伪静态规则（宝塔面板适用）
# 使用方法: 宝塔面板 → 网站 → 设置 → 伪静态 → 粘贴本文件内容
# ============================================================

# 站点根目录请指向项目的 public 目录
# 例如: /www/wwwroot/aurora-blog/public

location / {
    try_files $uri $uri/ /index.php?$query_string;
}

# 后台伪静态（可选，保留默认 /admin/index.php 访问即可）
location /admin/ {
    try_files $uri $uri/ /admin/index.php?$query_string;
}

# 上传文件缓存
location ~* ^/uploads/.*\.(jpg|jpeg|png|gif|webp)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
}

# 静态资源缓存
location ~* \.(css|js|svg|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public";
}

# 安全：禁止访问隐藏文件
location ~ /\.(?!well-known) {
    deny all;
}
